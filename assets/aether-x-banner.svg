<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">AETHER-X — Protocolo de Defesa</title>
  <desc id="desc">Banner cyberpunk com horizonte de cidade neon e título AETHER-X.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2431"/>
      <stop offset=".52" stop-color="#08111c"/>
      <stop offset="1" stop-color="#100d1b"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#83fbff"/>
      <stop offset=".48" stop-color="#39e5ef"/>
      <stop offset="1" stop-color="#a5f5ff"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
